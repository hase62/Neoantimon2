    </text>
  </g>
  <g id="optional-values">
    <text x="40" y="815.86" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" data-box="40 798 516 74">
      <tspan x="40" y="815.86">RNA counts / expression • CCF • MS</tspan>
      <tspan x="40" y="838.66">Supply their supported tables separately.</tspan>
      <tspan x="40" y="861.46">No file ≠ a measured negative.</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="24" y="904.92" fill="#52616d" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="24 888 1152 27">
      <tspan x="24" y="904.92">Tiny demo windows and reference bytes are technical fixtures, not human-analysis settings.</tspan>
    </text>
  </g>
</svg>