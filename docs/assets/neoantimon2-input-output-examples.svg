    </text>
  </g>
  <g id="out-label-5">
    <text x="616" y="822.92" fill="#a34a09" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="616 806 115 25" font-weight="700">
      <tspan x="616" y="822.92">Explain</tspan>
    </text>
  </g>
  <g id="out-value-5">
    <text x="736" y="822.45" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="17.5" text-anchor="start" data-box="736 806 424 26">
      <tspan x="736" y="822.45">candidate → origins → events</tspan>
    </text>
  </g>
  <g id="optional">
    <rect x="24" y="740" width="548" height="140" fill="#f5f6f7" stroke="#52616d" stroke-width="1.5" rx="10" ry="10" />
