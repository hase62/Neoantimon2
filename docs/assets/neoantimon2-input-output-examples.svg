<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Neoantimon2 — recognize the files and records</title>
  <desc id="figure-description">Independent synthetic snippets. Patient/sample mapping and HLA examples are declarations, not one linked biological case. Valid single-sample tab-separated VCF syntax is shown. References are versioned external resources. Output examples use the official synthetic Quick Start: chr1:4 G&gt;A, transcript TA, KPK test peptide and HLA-A*02:01, NOT_RUN/NOT_GRADED. No biological or clinical validation is asserted.</desc>
  <defs>
    <marker id="arrow-native" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#176487" />
    </marker>
    <marker id="arrow-external" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#a34a09" />
    </marker>
    <marker id="arrow-optional" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#52616d" />
    </marker>
  </defs>
  <rect width="1200" height="920" fill="#ffffff" />
  <g id="title">
    <text x="24" y="45.08" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="32" text-anchor="start" data-box="24 15 1152 42" font-weight="700">
      <tspan x="24" y="45.08">Recognize the files and records</tspan>
    </text>
  </g>
  <g id="scope">
    <text x="24" y="82.86" fill="#a34a09" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" data-box="24 65 1152 28">
      <tspan x="24" y="82.86">SYNTHETIC EXAMPLES • Independent panels, not one linked biological case</tspan>
    </text>
  </g>
  <g id="map">
    <rect x="24" y="111" width="548" height="182" fill="#f1f6f9" stroke="#176487" stroke-width="1.5" rx="10" ry="10" />
  </g>
  <g id="hla">
    <rect x="600" y="111" width="576" height="182" fill="#f1f6f9" stroke="#176487" stroke-width="1.5" rx="10" ry="10" />
  </g>
  <g id="map-title">
    <text x="40" y="147.62" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="start" data-box="40 126 516 30" font-weight="700">
      <tspan x="40" y="147.62">Samples → patients</tspan>
    </text>
  </g>
  <g id="map-values">
    <text x="40" y="182.92" fill="#233746" font-family="monospace" font-size="18" text-anchor="start" data-box="40 166 516 112" xml:space="preserve">
      <tspan x="40" y="182.92">sample_id   patient_id   input</tspan>
      <tspan x="40" y="204.52">S1          P1           S1.vcf</tspan>
      <tspan x="40" y="226.12">S2          P1           S2.vcf</tspan>
      <tspan x="40" y="247.72">S3          P2           S3.vcf</tspan>
    </text>
  </g>
  <g id="hla-title">
    <text x="616" y="147.62" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="start" data-box="616 126 544 30" font-weight="700">
      <tspan x="616" y="147.62">Patient HLA (you supply it)</tspan>
    </text>
  </g>
  <g id="hla-values">
    <text x="616" y="182.92" fill="#233746" font-family="monospace" font-size="18" text-anchor="start" data-box="616 166 544 112" xml:space="preserve">
      <tspan x="616" y="182.92">P1: HLA-A*02:01, HLA-B*07:02</tspan>
      <tspan x="616" y="204.52">P2: HLA-A*03:01</tspan>
      <tspan x="616" y="226.12">Class II: explicit alpha~beta pair</tspan>
      <tspan x="616" y="247.72">HLA-DRA*01:01~HLA-DRB1*15:01</tspan>
    </text>
  </g>
  <g id="vcf">
    <rect x="24" y="315" width="1152" height="174" fill="#f1f6f9" stroke="#176487" stroke-width="1.5" rx="10" ry="10" />
  </g>
  <g id="vcf-title">
    <text x="40" y="351.62" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="start" data-box="40 330 1120 30" font-weight="700">
      <tspan x="40" y="351.62">S1.vcf — one sample column, fields separated by tabs</tspan>
    </text>
  </g>
  <g id="vcf-values">
    <text x="40" y="388.476" fill="#233746" font-family="monospace" font-size="15.4" text-anchor="start" data-box="40 374 1120 103" xml:space="preserve">
      <tspan x="40" y="388.476">##fileformat=VCFv4.2</tspan>
      <tspan x="40" y="406.956">##FORMAT=&lt;ID=GT,Number=1,Type=String,Description="Genotype"&gt;</tspan>
      <tspan x="40" y="425.436">#CHROM  POS     ID      REF     ALT     QUAL    FILTER  INFO    FORMAT  S1</tspan>
      <tspan x="40" y="443.916">chr1    4       .       G       A       .       PASS    .       GT      0/1</tspan>
    </text>
  </g>
  <g id="refs">
    <rect x="24" y="512" width="548" height="205" fill="#f1f6f9" stroke="#176487" stroke-width="1.5" rx="10" ry="10" />
  </g>
  <g id="refs-title">
    <text x="40" y="548.62" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="start" data-box="40 527 516 30" font-weight="700">
      <tspan x="40" y="548.62">External reference files</tspan>
    </text>
  </g>
  <g id="refs-values">
    <text x="40" y="586.92" fill="#233746" font-family="monospace" font-size="18" text-anchor="start" data-box="40 570 516 112" xml:space="preserve">
      <tspan x="40" y="586.92">genome.fa + genome.fa.fai</tspan>
      <tspan x="40" y="608.52">gencode.v50.*.gtf / *.fa</tspan>
      <tspan x="40" y="630.12">+ selenocysteine metadata</tspan>
      <tspan x="40" y="651.72">MANE.GRCh38.v1.5.*.txt / *.gtf</tspan>
    </text>
  </g>
  <g id="refs-build">
    <text x="40" y="700.92" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="40 684 516 26">
      <tspan x="40" y="700.92">GRCh38.p14 • GENCODE 50 • MANE 1.5</tspan>
    </text>
  </g>
  <g id="readback">
    <rect x="600" y="512" width="576" height="368" fill="#fff4e9" stroke="#a34a09" stroke-width="1.5" rx="10" ry="10" />
  </g>
  <g id="readback-title">
    <text x="616" y="548.62" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="start" data-box="616 527 544 30" font-weight="700">
      <tspan x="616" y="548.62">Official Quick Start outputs</tspan>
    </text>
  </g>
  <g id="out-label-0">
    <text x="616" y="587.92" fill="#a34a09" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="616 571 115 25" font-weight="700">
      <tspan x="616" y="587.92">Event</tspan>
    </text>
  </g>
  <g id="out-value-0">
    <text x="736" y="587.45" fill="#233746" font-family="monospace" font-size="17.5" text-anchor="start" data-box="736 571 424 26" xml:space="preserve">
      <tspan x="736" y="587.45">chr1:4 G&gt;A</tspan>
    </text>
  </g>
  <g id="out-label-1">
    <text x="616" y="634.92" fill="#a34a09" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="616 618 115 25" font-weight="700">
      <tspan x="616" y="634.92">Origin</tspan>
    </text>
  </g>
  <g id="out-value-1">
    <text x="736" y="634.45" fill="#233746" font-family="Arial, Helvetica, sans-serif" font-size="17.5" text-anchor="start" data-box="736 618 424 26">
      <tspan x="736" y="634.45">transcript TA → translation path</tspan>
    </text>
  </g>
  <g id="out-label-2">
    <text x="616" y="681.92" fill="#a34a09" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="616 665 115 25" font-weight="700">
      <tspan x="616" y="681.92">Peptide</tspan>
    </text>
  </g>
  <g id="out-value-2">
    <text x="736" y="681.45" fill="#233746" font-family="monospace" font-size="17.5" text-anchor="start" data-box="736 665 424 26" xml:space="preserve">
      <tspan x="736" y="681.45">KPK (3-aa technical window)</tspan>
    </text>
  </g>
  <g id="out-label-3">
    <text x="616" y="728.92" fill="#a34a09" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="616 712 115 25" font-weight="700">
      <tspan x="616" y="728.92">Candidate</tspan>
    </text>
  </g>
  <g id="out-value-3">
    <text x="736" y="728.45" fill="#233746" font-family="monospace" font-size="17.5" text-anchor="start" data-box="736 712 424 26" xml:space="preserve">
      <tspan x="736" y="728.45">KPK + HLA-A*02:01</tspan>
    </text>
  </g>
  <g id="out-label-4">
    <text x="616" y="775.92" fill="#a34a09" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" data-box="616 759 115 25" font-weight="700">
      <tspan x="616" y="775.92">Result</tspan>
    </text>
  </g>
  <g id="out-value-4">
    <text x="736" y="775.45" fill="#233746" font-family="monospace" font-size="17.5" text-anchor="start" data-box="736 759 424 26" xml:space="preserve">
