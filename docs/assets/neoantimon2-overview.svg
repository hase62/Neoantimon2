  <title id="figure-title">Neoantimon2 — from variants to traceable candidates</title>
  <desc id="figure-description">Five stages: explicit sample, patient, variant, HLA and reference inputs; variant/sequence reconstruction with multiple origins; peptide-HLA candidates retaining all origin links; optional configured native prediction or separate external export/model/conversion/import; results and explanations. Native and external analyses stay separate. Research candidates are not clinical validation.</desc>
